<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="120px-Induslogo.png">
    <title>Industrialist Line Generator</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body>

    <div class="container">
        <h1>Industrialist Line Generator</h1>

        <div class="card">
            <h2>1. Machine Recipes</h2>
            <div class="input-group">
                <input type="hidden" id="editId">
                <input type="text" id="mName" placeholder="Machine Name">
                <input type="number" id="mTime" placeholder="Process Time (s)">
                <input type="number" id="mPower" placeholder="Power (KW)">
                <input type="number" id="mCost" placeholder="Build Cost ($)">
            </div>
            <div class="input-group">
                <input type="text" id="mInputs" placeholder="Inputs (e.g. 2 coal, 6 water)">
                <input type="text" id="mOutputs" placeholder="Outputs (e.g. 1 steel ingot)">
            </div>
            <button id="saveBtn" onclick="addRecipe()" style="width: 100%;">
                💾 Save Recipe
            </button>
            <div id="recipeDisplay" class="recipe-grid"></div>
            <div class="input-group" style="margin-top: 10px;">
                <button onclick="exportData()" style="background: var(--secondary); flex: 1;">📤 Export Data</button>
                <button onclick="importData()" style="background: var(--edit); flex: 1;">📥 Import Data</button>
                <button onclick="deleteAllRecipes()" style="background: var(--danger); flex: 1;">🗑️ Delete All</button>
            </div>
        </div>

        <div class="card">
            <h2>2. Production Target</h2>

            <div class="input-group">
                <input type="text" id="targetItem" placeholder="Target Item">

                <input type="number" id="targetQty" placeholder="Quantity">

                <input type="number" id="targetTime" placeholder="Over Time (s)">
            </div>

            <div class="input-group" style="
                margin-top: 20px;
                border-top: 1px solid var(--grey);
                padding-top: 15px;
            ">
                <input type="number" id="currentBank" placeholder="Current Bank Balance" value="30000000">

                <button onclick="calculateAll()" style="
                    background: var(--success);
                    flex: 2;
                    font-size: 1.1em;
                ">
                    🚀 Run Full Simulation
                </button>
            </div>
        </div>

        <div id="results">
            <h2 style="color: var(--success);">📊 Deployment Blueprint</h2>
            <div
                style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-weight: bold; color: var(--text);">
                <label class="switch">
                    <input type="checkbox" id="advancedToggle" onchange="calculateAll()">
                    <span class="slider"></span>
                </label>
                <span>Advanced View (Show Rates)</span>
            </div>
            <div id="machineList"></div>
            <div id="summaryList" class="summary-box"></div>
        </div>
    </div>
</body>

</html>
